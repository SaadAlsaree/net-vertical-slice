name: templates

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test template verification harness
        run: dotnet test templates/TemplateTests/TemplateTests.csproj --configuration Release
